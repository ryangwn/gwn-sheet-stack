name: Setup
description: Install Bun and run a cached `bun install --frozen-lockfile`. Caller must check out the repo first.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - shell: bash
      run: bun install --frozen-lockfile
