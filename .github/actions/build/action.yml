name: Build
description: Restore packages/*/dist from cache; run `bun run build` only on cache miss.

runs:
  using: composite
  steps:
    - id: dist-cache
      uses: actions/cache@v4
      with:
        path: packages/*/dist
        key: dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/**/src/**', 'packages/**/tsconfig*.json', 'packages/**/package.json') }}

    - if: steps.dist-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bun run build
