name: Release

on:
  push:
    branches:
      - 'release/v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from branch
        id: ver
        run: |
          ref="${GITHUB_REF_NAME}"
          version="${ref#release/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Branch '$ref' does not match release/vX.Y.Z[-prerelease]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup

      - name: Consume changesets (CHANGELOG.md + version bumps)
        run: bunx changeset version

      - name: Override versions to match branch name
        run: |
          version="${{ steps.ver.outputs.version }}"
          for pkg in packages/*/package.json; do
            private=$(jq -r '.private // false' "$pkg")
            [ "$private" = "true" ] && continue
            tmp=$(mktemp)
            jq --arg v "$version" '.version = $v' "$pkg" > "$tmp" && mv "$tmp" "$pkg"
            echo "→ $(jq -r .name "$pkg") @ $version"
          done

      - uses: ./.github/actions/build

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: bunx changeset publish

      - name: Commit changelog + version bumps to release branch
        run: |
          version="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$version [skip ci]"
            git push origin HEAD
          else
            echo "Nothing to commit."
          fi

      - name: Tag release
        run: |
          version="${{ steps.ver.outputs.version }}"
          git tag -a "v$version" -m "Release v$version"
          git push origin "v$version"

      - name: Open sync PR to master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.ver.outputs.version }}"
          gh pr create \
            --base master \
            --head "${GITHUB_REF_NAME}" \
            --title "chore(release): v$version" \
            --body "Sync CHANGELOG.md and version bumps from \`${GITHUB_REF_NAME}\`." \
            2>/dev/null || echo "PR already exists or nothing to sync."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.ver.outputs.version }}"
          gh release create "v$version" \
            --title "v$version" \
            --generate-notes \
            --target "${GITHUB_REF_NAME}"
