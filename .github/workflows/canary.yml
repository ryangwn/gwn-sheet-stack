name: Canary

on:
  push:
    branches:
      - 'canary/*'

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml

  detect:
    name: Detect pending changesets
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.check.outputs.pending }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          shopt -s nullglob
          files=(.changeset/*.md)
          pending=0
          for f in "${files[@]}"; do
            [ "$(basename "$f")" = "README.md" ] && continue
            pending=1
            break
          done
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish canary
    needs: [verify, detect]
    if: needs.detect.outputs.pending == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/build

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Snapshot version
        run: bunx changeset version --snapshot canary

      - name: Publish canary
        run: bunx changeset publish --tag canary --no-git-tag
