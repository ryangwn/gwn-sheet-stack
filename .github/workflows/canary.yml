name: Canary

on:
  push:
    branches:
      - 'canary/*'

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml

  publish:
    name: Publish canary
    needs: verify
    if: github.repository == 'ryangwn/gwn-sheet-stack'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for pending changesets
        id: check
        run: |
          shopt -s nullglob
          files=(.changeset/*.md)
          pending=0
          for f in "${files[@]}"; do
            base="$(basename "$f")"
            if [ "$base" = "README.md" ]; then continue; fi
            pending=1
            break
          done
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Skip (no pending changesets)
        if: steps.check.outputs.pending == '0'
        run: echo "No pending changesets — skipping canary publish."

      - uses: ./.github/actions/setup
        if: steps.check.outputs.pending == '1'

      - uses: ./.github/actions/build
        if: steps.check.outputs.pending == '1'

      - name: Configure npm auth
        if: steps.check.outputs.pending == '1'
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Snapshot version
        if: steps.check.outputs.pending == '1'
        run: bunx changeset version --snapshot canary

      - name: Update lockfile
        if: steps.check.outputs.pending == '1'
        run: bun install --lockfile-only

      - name: Publish canary
        if: steps.check.outputs.pending == '1'
        run: bun scripts/publish.ts --tag canary --no-git-checks
